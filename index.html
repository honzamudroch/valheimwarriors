<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://sfaxumbeilroctogyzri.supabase.co; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valheim Warriors</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,400;0,700;1,400&family=Metamorphous&display=swap">
<style>
:root{
  --bg:#100e0b; --panel:#1f1912; --panel-2:#2a2218; --panel-3:#161209; --line:#5a4630; --line-2:#3a2e20; --rivet:#8a7048;
  --ink:#e6d5a8; --ink-2:#c9b88a; --muted:#9a8a6a; --gold:#d9a441; --gold-2:#f0c060; --ember:#e08a2e; --rust:#c0392b; --moss:#7a9a3f; --frost:#6f9fb8; --bone:#f1e4c0;
  --bar:#0f0c08; --bar-line:#4a3a26; --grid:#1a150f; --shadow:rgba(0,0,0,.6);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e9dcc0; --panel:#f4ead2; --panel-2:#eadfc3; --panel-3:#dfd2b2; --line:#8a6f48; --line-2:#c9b58f; --rivet:#6b5333;
    --ink:#2b2114; --ink-2:#4a3c28; --muted:#7a684c; --gold:#8a5a12; --gold-2:#6e4608; --ember:#b8621a; --rust:#a02a20; --moss:#4f6f24; --frost:#3a6f8a; --bone:#2b2114;
    --bar:#d8c9a5; --bar-line:#b9a47c; --grid:#ddd0b0; --shadow:rgba(80,50,10,.18);
  }
}
:root[data-theme="light"]{
  --bg:#e9dcc0; --panel:#f4ead2; --panel-2:#eadfc3; --panel-3:#dfd2b2; --line:#8a6f48; --line-2:#c9b58f; --rivet:#6b5333;
  --ink:#2b2114; --ink-2:#4a3c28; --muted:#7a684c; --gold:#8a5a12; --gold-2:#6e4608; --ember:#b8621a; --rust:#a02a20; --moss:#4f6f24; --frost:#3a6f8a; --bone:#2b2114;
  --bar:#d8c9a5; --bar-line:#b9a47c; --grid:#ddd0b0; --shadow:rgba(80,50,10,.18);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);background-image:radial-gradient(ellipse at 50% 0%,rgba(217,164,65,.07),transparent 60%);color:var(--ink);font-family:"Averia Serif Libre",Georgia,serif;font-size:14px;line-height:1.35;padding-block:22px 40px;padding-inline:clamp(16px,3vw,32px)}
.wrap{max-width:none;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-family:"Metamorphous",serif;font-weight:400;font-size:28px;margin:0;color:var(--gold);letter-spacing:.02em;text-shadow:0 2px 0 var(--shadow)}
.top .small{color:var(--muted);font-size:13px}
.sheets{scroll-behavior:smooth;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(380px,640px);grid-template-rows:repeat(14,auto);gap:0 20px;align-items:start;justify-content:center;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;padding-bottom:14px;scrollbar-color:var(--gold) var(--bar);scrollbar-width:thin}
.sheets::-webkit-scrollbar{height:10px}
.sheets::-webkit-scrollbar-track{background:var(--bar);border:1px solid var(--bar-line)}
.sheets::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#f0c060,#b8761a);border:1px solid #5a4630}
.sheets > .sheet{scroll-snap-align:start}
.sheets.scrolling{justify-content:start}
.sheets > .empty{grid-row:1 / -1}
@media (max-width:760px){.sheets{display:block;overflow:visible}.sheets.scrolling{justify-content:start}.sheet{display:block;margin-bottom:18px}.floatbar{display:none}.nav{display:none!important}.two{grid-template-columns:1fr}.attrs{grid-template-columns:repeat(2,1fr)}.skills{grid-template-columns:1fr;grid-auto-flow:row}}
.sheet{position:relative;display:grid;grid-template-rows:subgrid;grid-row:span 14;row-gap:0;align-content:start}
.blk{min-width:0}
.blk h2{margin-top:16px}
.blk.b-foot{align-self:end}
.sheet{position:relative;background:linear-gradient(180deg,var(--panel-2),var(--panel) 12%,var(--panel) 88%,var(--panel-3));border:2px solid var(--line);box-shadow:inset 0 0 0 1px var(--panel-3),inset 0 0 0 3px var(--line-2),0 6px 18px var(--shadow);padding:16px 16px 18px}
.rivet{position:absolute;width:8px;height:8px;background:var(--rivet);border-radius:50%;box-shadow:0 1px 0 var(--shadow)}
.rivet.tl{left:5px;top:5px}.rivet.tr{right:5px;top:5px}.rivet.bl{left:5px;bottom:5px}.rivet.br{right:5px;bottom:5px}

/* hlava listu */
.name{font-family:"Metamorphous",serif;font-weight:400;font-size:30px;line-height:1.05;color:var(--gold);margin:0;text-shadow:0 2px 0 var(--shadow);letter-spacing:.01em}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-top:4px}
.portrait{display:grid;grid-template-columns:150px 1fr;gap:12px;margin-top:12px;align-items:start}
.portrait svg{width:120px;height:160px;display:block;background:radial-gradient(ellipse at 50% 80%,#3a2c1c,var(--bar) 75%);border:1px solid var(--line);box-shadow:inset 0 0 0 1px var(--line-2)}
.gear{display:grid;gap:3px;font-size:13px}
.gear .row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:baseline;border-bottom:1px solid var(--line-2);padding:3px 0}
.gear .row:last-child{border-bottom:0}
.gear b{font-weight:700;color:var(--ink)}
.gear .slot{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-right:5px}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.gear .sl{display:flex;align-items:center;gap:2px;line-height:1.1}
.gear .txt b{display:block;line-height:1.2}
.pips i{width:6px;height:6px;background:var(--gold);display:inline-block;transform:rotate(45deg)}
.pips i.off{background:var(--line-2)}
.gear .dur{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.gear .dur.low{color:var(--rust)}

/* atributy */
.attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.attr{background:var(--bar);border:1px solid var(--bar-line);padding:8px 9px 7px;box-shadow:inset 0 1px 0 rgba(0,0,0,.4)}
.attr b{font-weight:700;font-size:22px;line-height:1;display:block;color:var(--gold-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.attr span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.attr.rust b{color:var(--rust)}
.attr small{display:block;font-size:11.5px;color:var(--ink-2);margin-top:2px}

/* sekce */
h2{font-family:"Metamorphous",serif;font-weight:400;font-size:15px;margin:16px 0 6px;color:var(--gold);display:flex;align-items:center;gap:8px;letter-spacing:.03em}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
h2 .n{color:var(--muted);font-size:12px;font-family:"Averia Serif Libre",serif}
h2::after{order:1}
h2 .sum{order:2;font-family:"Averia Serif Libre",serif;font-size:14px;color:var(--gold-2);font-variant-numeric:tabular-nums;font-weight:700}
.eyebrow.split{display:flex;justify-content:space-between;align-items:baseline}
.eyebrow.split b{color:var(--gold-2);font-size:12.5px;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.kv{width:100%;border-collapse:collapse;font-size:13px}
.kv td{padding:2px 0;border-bottom:1px solid var(--line-2);vertical-align:baseline}
.kv td:first-child{color:var(--ink-2)}
.kv td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;padding-left:8px;color:var(--ink)}
.kv tr:last-child td{border-bottom:0}
.kv tr.sub td{padding-left:10px;font-size:12px}
.kv tr.sub td:first-child{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.two .kv{align-self:start}

/* skilly - jako ve hre: tmavy zlab, oranzova vypln */
.skills{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;gap:4px 14px}
.sk{display:grid;grid-template-columns:1fr 26px;gap:6px;align-items:center;font-size:13px}
.sk .t{height:7px;background:var(--bar);border:1px solid var(--bar-line);position:relative;margin-top:2px}
.sk .t i{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#f0a040,#c86a18)}
.sk .t i.frost{background:linear-gradient(180deg,#e0a050,#b86a28)}
.sk .t i.moss{background:linear-gradient(180deg,#c89050,#9a6a30)}
.sk .v{font-weight:700;font-size:14px;text-align:right;color:var(--gold-2);font-variant-numeric:tabular-nums}
.sk .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.sk.zero .n,.sk.zero .v{color:var(--muted)}

/* kills */
.kills{display:grid;gap:3px}
.kb{display:grid;grid-template-columns:minmax(80px,110px) 1fr 40px;gap:8px;align-items:center;font-size:13px}
.kb .t{height:9px;background:var(--bar);border:1px solid var(--bar-line);position:relative}
.kb .t i{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#d8503a,#8c2418)}
.kb .t i.big{background:linear-gradient(180deg,#d8503a,#8c2418)}
.kb .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.kb .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
details summary{cursor:pointer;color:var(--gold);font-size:12.5px;margin-top:6px;list-style:none}
details summary::before{content:"\25B8 "}
details[open] summary::before{content:"\25BE "}

/* mapa + batoh */
.mapbig svg{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;vertical-align:-1px;margin-right:5px}
.troph.big .ico{width:32px;height:32px}
.pack{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.cell{aspect-ratio:1;background:var(--bar);border:1px solid var(--bar-line);position:relative;font-size:8.5px;line-height:1.05;padding:2px;overflow:hidden;color:var(--ink-2)}
.cell.eq{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(217,164,65,.35)}
.cell .st{position:absolute;right:2px;bottom:1px;font-weight:700;font-size:10px;color:var(--bone)}
.trivia{font-size:13px;color:var(--ink-2)}
.trivia p{margin:0 0 5px}
.k{font-weight:700;color:var(--gold-2);font-variant-numeric:tabular-nums}
.foot{font-size:11.5px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line-2);padding-top:8px}
footer{color:var(--muted);font-size:12.5px;margin-top:22px}
.lang{display:inline-flex;border:1px solid var(--line);background:var(--bar)}
.lang button{font:inherit;font-size:12px;letter-spacing:.08em;padding:3px 10px;background:transparent;border:0;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--gold);color:#1a1208;font-weight:700}
.nav button{font-size:16px;padding:1px 10px;line-height:1.2}
.lang button:not(.on):hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:400px){.attrs{grid-template-columns:repeat(2,1fr)}.portrait{grid-template-columns:110px 1fr}.portrait svg,.portrait .fig{width:110px;height:154px}.portrait .fig img{max-width:104px;max-height:146px}}

/* herni ikony a render sady */
.portrait .fig{width:150px;height:210px;display:grid;place-items:end center;background:radial-gradient(ellipse at 50% 85%,#3a2c1c,var(--bar) 75%);border:1px solid var(--line);box-shadow:inset 0 0 0 1px var(--line-2);overflow:hidden;position:relative}
.portrait .fig.icons .stack{display:grid;grid-template-rows:56px 66px 66px;gap:2px;align-items:center;justify-items:center;padding-bottom:22px}
.portrait .fig.icons .stack img{width:56px;height:56px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.7))}
.portrait .fig.icons .stack img:first-child{width:48px;height:48px}
.portrait .fig.icons .stack span{width:56px;height:56px;border:1px dashed var(--line-2);opacity:.5}
.portrait .fig.paper img.body.dim{opacity:.55;filter:grayscale(.4) drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.portrait .fig.paper img.part{position:absolute;width:46px;height:46px;left:50%;transform:translateX(-50%);filter:drop-shadow(0 3px 4px rgba(0,0,0,.8));pointer-events:auto}
.portrait .fig.paper img.part.head{top:6px}.portrait .fig.paper img.part.chest{top:64px}.portrait .fig.paper img.part.legs{top:122px}
.portrait .fig img.body{max-width:142px;max-height:200px;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.portrait .fig img.hand{position:absolute;width:44px;height:44px;pointer-events:auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.8))}
.portrait .fig img.pin{position:absolute;left:2px;width:36px;height:36px;pointer-events:auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.8));outline:1px solid var(--line-2);outline-offset:-1px;background:rgba(0,0,0,.35)}
.portrait .fig img.hand.l{left:2px;bottom:78px}.portrait .fig img.hand.r{right:2px;bottom:78px}.portrait .fig img.hand.b{right:2px;top:4px;width:36px;height:36px}
.portrait .fig .cap{position:absolute;left:0;right:0;bottom:0;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:linear-gradient(transparent,rgba(0,0,0,.55));padding:10px 4px 3px;text-align:center}
.ico{width:28px;height:28px;display:inline-block;vertical-align:middle;image-rendering:auto;background:var(--bar);border:1px solid var(--bar-line);padding:2px;box-sizing:content-box}
.gear .row{grid-template-columns:34px 1fr auto}
.gear .row .txt{min-width:0}
.cell img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain}
.cell.hasico{color:transparent;font-size:0}
.troph{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.troph .ico{width:26px;height:26px}

/* armor a utok pod postavou */
.gs{display:grid;gap:6px;margin-top:6px;width:150px}
.gsb{background:var(--bar);border:1px solid var(--bar-line);padding:6px 7px 7px}
.gsb .h{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.gsb .h span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.gsb .h b{font-size:20px;line-height:1;color:var(--gold-2);font-variant-numeric:tabular-nums}
.gsb .bar{display:flex;height:8px;margin-top:5px;background:var(--panel-3);border:1px solid var(--line-2);overflow:hidden}
.gsb .bar i{display:block;height:100%}
.gsb .lg{display:flex;flex-wrap:wrap;gap:2px 8px;margin-top:4px;font-size:10px;color:var(--ink-2);line-height:1.2}
.gsb .lg i{display:inline-block;width:7px;height:7px;margin-right:3px;vertical-align:-1px}
.gsb .sub{font-size:10.5px;color:var(--muted);margin-top:3px}
.portrait{grid-template-columns:150px 1fr}

.gsb .real{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line-2)}
.gsb .real b{font-size:17px;line-height:1;color:var(--bone);font-variant-numeric:tabular-nums;display:block}
.gsb .real span{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.gsb .real .note{grid-column:1/-1;font-size:10px;color:var(--muted);line-height:1.3}

.stamp{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--ink)}
.stamp b{color:inherit;font-weight:400;font-variant-numeric:tabular-nums}
.stamp i{width:8px;height:8px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.stamp.fresh i{background:var(--moss)}.stamp.ok i{background:var(--gold)}.stamp.old i{background:var(--rust)}
.stamp.old{color:var(--rust)}
.stamp.synced{color:#9fcf5a}
.stamp small{margin-left:auto;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--moss);opacity:.85}
.tip .desc{font-size:12px;color:var(--ink-2);line-height:1.35;margin:2px 0 6px}
.tip .desc i{color:var(--ink);display:block;margin-bottom:2px}
.rk{display:inline-block;font-size:9.5px;line-height:1;padding:2px 4px;margin-left:5px;vertical-align:middle;border:1px solid var(--line-2);color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em;background:var(--bar)}
.rk.rk-best{border-color:var(--gold);color:var(--gold-2);background:rgba(217,164,65,.12)}
.rk.rk-worst{border-color:var(--rust);color:#f0a090}
.attr .rk{position:absolute;right:5px;top:5px;margin:0}
.attr{position:relative}
.cmp-best{color:var(--gold-2)!important}
.cmp-worst{color:#e08070!important}
.kb .v .rk{display:none}
.kb .v.cmp-mid{color:var(--muted)}
/* tooltip */
[data-item]{cursor:help}
.tip{position:fixed;z-index:9999;max-width:290px;background:linear-gradient(180deg,#2a2218,#1a150f);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.6),inset 0 0 0 1px var(--line-2);padding:10px 12px;font-size:12.5px;color:var(--ink);pointer-events:none;display:none}
.tip.on{display:block}
.tip .th{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;margin-bottom:6px}
.tip .th img{width:44px;height:44px;background:var(--bar);border:1px solid var(--bar-line);padding:2px;box-sizing:content-box}
.tip .th b{font-family:"Metamorphous",serif;font-weight:400;font-size:15px;color:var(--gold);display:block;line-height:1.15}
.tip .th small{color:var(--muted);font-size:11px;display:block;margin-top:2px}
.tip table{width:100%;border-collapse:collapse;font-size:12px}
.tip td,.tip th{padding:2px 4px;border-bottom:1px solid var(--line-2);text-align:right;font-variant-numeric:tabular-nums}
.tip td:first-child,.tip th:first-child{text-align:left;color:var(--ink-2)}
.tip th{color:var(--muted);font-weight:400;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.tip tr:last-child td{border-bottom:0}
.tip td.cur,.tip th.cur{color:var(--gold-2);font-weight:700}
.tip .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px solid var(--line-2)}
.tip .row:last-child{border-bottom:0}
.tip .row span:first-child{color:var(--ink-2)}
.tip .note{color:var(--muted);font-size:11px;margin-top:6px;line-height:1.3}
:root[data-theme="light"] .tip, .tip.light{background:linear-gradient(180deg,#f4ead2,#eadfc3)}

/* achievementy */
.ach{position:absolute;right:14px;top:14px;display:flex;align-items:center;gap:6px;background:var(--bar);border:1px solid var(--bar-line);padding:4px 8px 4px 6px;cursor:pointer;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;z-index:2}
.ach:hover{border-color:var(--gold)}
.ach .medal{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f4d27a,#b8761a 70%);box-shadow:0 0 0 1px #5a4630;display:inline-block}
.ach.priv .medal{background:radial-gradient(circle at 40% 35%,#8a8073,#4a4238 70%)}
.ach b{color:var(--gold-2);font-weight:700}
.achpop{position:fixed;z-index:9998;width:min(340px,92vw);max-height:70vh;overflow:auto;background:linear-gradient(180deg,#2a2218,#1a150f);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.65),inset 0 0 0 1px var(--line-2);padding:12px 14px;display:none;color:var(--ink)}
.achpop.on{display:block}
.achpop .achx{position:absolute;right:8px;top:6px;background:transparent;border:0;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:2px 6px}
.achpop .achx:hover{color:var(--rust)}
.achpop h4{padding-right:22px}
.achpop h4{font-family:"Metamorphous",serif;font-weight:400;font-size:15px;color:var(--gold);margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.achpop h4 span{font-family:"Averia Serif Libre",serif;font-size:12px;color:var(--muted)}
.achpop .a{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-2)}
.achpop .a:last-child{border-bottom:0}
.achpop .a img{width:40px;height:40px;display:block;border:1px solid var(--bar-line)}
.achpop .a b{display:block;font-size:13px;color:var(--ink)}

function sprite(P){
  const eq = P.inventory.filter(i=>i.equipped);
  const has = re => eq.find(i=>re.test(i.name));
  const helmet=has(/^Helmet/), chest=has(/Chest$/), legs=has(/Legs$/), cape=has(/^Cape/), shield=has(/^Shield/), belt=has(/^Belt|^Megingjord/), weapon=has(WEAPON_RE);
  const hairC = P.hair_color||[0.5,0.35,0.2], skinC = P.skin||[0.85,0.85,0.85];
  const CH = armorPal(chest&&chest.name,{a:'#7a6a55',b:'#54473a',c:'#95836b'}), LG = armorPal(legs&&legs.name,{a:'#5a4a3a',b:'#3c3026',c:'#6d5a48'});
  const HM = armorPal(helmet&&helmet.name,null), CP = capePal(cape&&cape.name), SH = shieldPal(shield&&shield.name);
  const pal = {O:'#1a1410', S:rgb([0.93*skinC[0],0.74*skinC[1],0.58*skinC[2]]), s:rgb([0.68*skinC[0],0.50*skinC[1],0.38*skinC[2]]), E:'#1a1410', H:rgb(hairC), h:rgb(hairC.map(x=>x*0.62)),
    C:CH.a, c:CH.b, C2:CH.c, L:LG.a, l:LG.b, B:'#2a221c', G:'#3a2a1c', g: belt?'#d1a55a':'#3a2a1c', N:'#c9ced4', n:'#5a4030', A:'#8a8f96', T: has(/^Trinket|^Wishbone/)?'#d1a55a':CH.a};
  if(HM) Object.assign(pal,{K:HM.a,k:HM.b,K2:HM.c});
  if(CP) Object.assign(pal,{P:CP.a,p:CP.b});
  if(SH) Object.assign(pal,{W:SH.m,w:SH.r,X:SH.x});
  const layers=[];
  if(CP) layers.push(LAYER_CAPE);
  layers.push(LAYER_BODY);
  layers.push(/Bronze|Iron|Padded|Carapace/.test(chest&&chest.name||'') ? LAYER_CHEST_PLATE : LAYER_CHEST_FUR);
  layers.push(LAYER_HAIR);

  const hk=helmKind(helmet&&helmet.name);
  if(hk==='hood') layers.push(LAYER_HOOD); else if(hk==='helm') layers.push(LAYER_HELM); else if(hk==='cap') layers.push(LAYER_CAP);
  if(SH) layers.push(SH.tower?LAYER_SHIELD_TOWER:LAYER_SHIELD_ROUND);
  const wk=weaponKind(weapon&&weapon.name); if(wk) layers.push(WEAPONS[wk]);
  const grid = Array.from({length:32},()=>Array(24).fill(null));
  for(const layer of layers) layer.forEach((row,y)=>{ for(let x=0;x<24;x++){ const ch=row[x]||'.'; if(ch!=='.') grid[y][x]=ch; } });
  let s='';
  grid.forEach((row,y)=>row.forEach((ch,x)=>{ if(!ch) return; const col = ch==='2' ? (grid[y][x-1]==='K'&&pal.K2?pal.K2:pal.C2) : pal[ch]; if(col) s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${col}"/>`; }));
  s+=`<rect x="4" y="31.6" width="16" height="0.4" fill="#000" opacity=".3"/>`;
  return `<svg viewBox="0 0 24 32" shape-rendering="crispEdges" role="img" aria-label="Postava ${esc(P.name||'')}">${s}</svg>`;
}

    else if(bowM){ bow=true; total=Math.max(0.8, 2.5-0.02*skLv); hits=1; }
  }
  if(atk.c){ const cm=atk.c.match(/([\d.]+)x/); if(cm) lastMul=parseFloat(cm[1]); }
  const chainDmg = perHit*(hits-1+lastMul);
  const dps = total ? chainDmg/total : null;
  return {perHit, dps, hits, total, lastMul, skName, skLv, f, bow, backstab: atk.b||null};
}

function gearStats(P){
  const eq=P.inventory.filter(i=>i.equipped);
  const pick=re=>eq.find(i=>re.test(i.name));
  const pieces=[[pick(/^Helmet/),'Hlava'],[pick(/Chest$/),'Hruď'],[pick(/Legs$/),'Nohy'],[pick(/^Cape/),'Plášť']].filter(([it])=>it);
  const arm=pieces.map(([it,slot])=>{ const lv=lvlOf(it); return {slot, v: lv&&lv.armor!=null? lv.armor : null, it}; });
  const known=arm.filter(a=>a.v!=null); const armorTotal=known.reduce((a,b)=>a+b.v,0); const unknownArm=arm.filter(a=>a.v==null);
  const wpn = eq.find(i=>MELEE_RE.test(i.name)) || bestOf(P.inventory.filter(i=>MELEE_RE.test(i.name)));
  const shd = eq.find(i=>/^Shield/.test(i.name)) || bestOf(P.inventory.filter(i=>/^Shield/.test(i.name)));
  const wl = wpn? lvlOf(wpn):null; const dmg = wl? Object.entries(wl.damage||{}).filter(([,v])=>v>0) : [];
  const dmgTotal = dmg.reduce((a,[,v])=>a+v,0);
  const sl = shd? lvlOf(shd):null;
  const EN=LANG==='en';
  const armBar = known.length? `<div class="bar">${known.map(a=>`<i style="width:${100*a.v/armorTotal}%;background:${PIECE_COL[a.slot]}" title="${esc(cz(a.it.name))} ${a.v}"></i>`).join('')}</div><div class="lg">${known.map(a=>`<span><i style="background:${PIECE_COL[a.slot]}"></i>${T(a.slot)} ${a.v}</span>`).join('')}</div>` : '';
  const armBox = `<div class="gsb"><div class="h"><span>${EN?'Armor':'Zbroj'}</span><b>${known.length?armorTotal:'?'}</b></div>${armBar}${unknownArm.length?`<div class="sub">${EN?'no data for':'bez dat pro'} ${unknownArm.map(a=>esc(cz(a.it.name))).join(', ')}</div>`:''}</div>`;
  const dmgBox = wpn ? `<div class="gsb"><div class="h"><span>${EN?'Damage':'Útok'}</span><b>${dmg.length?Math.round(dmgTotal):'?'}</b></div>${dmg.length?`<div class="bar">${dmg.map(([k,v])=>`<i style="width:${100*v/dmgTotal}%;background:${DMG_COL[k]||'#999'}" title="${k} ${v}"></i>`).join('')}</div><div class="lg">${dmg.map(([k,v])=>`<span><i style="background:${DMG_COL[k]||'#999'}"></i>${EN?k:(DMG_CZ[k]||k)} ${v}</span>`).join('')}</div>`:''}<div class="sub">${esc(cz(wpn.name))}${wpn.q>1?' ★'+wpn.q:''}${sl&&sl.block!=null?` · ${EN?'block':'blok'} ${sl.block}`:''}</div>${(()=>{ const c=attackCalc(wpn,P); if(!c) return ''; const sk=c.skName? (EN? humanize(c.skName) : (SKILL_CZ[c.skName]||c.skName)) : '?'; return `<div class="real"><div><b>${Math.round(c.perHit)}</b><span>${EN?'per hit':'za hit'}</span></div>${c.dps?`<div><b>${Math.round(c.dps)}</b><span>DPS</span></div>`:''}<div class="note">${sk} ${Math.round(c.skLv)} → ${Math.round(c.f*100)} %${c.hits>1?` · ${c.hits} ${EN?'hits':'seky'} / ${c.total} s${c.lastMul>1?`, ${EN?'last':'poslední'} ${c.lastMul}×`:''}`:(c.total?` · ${c.total.toFixed(2)} s${c.bow?(EN?' draw':' nátah'):''}`:'')}${c.backstab&&c.backstab!=='1x'?` · ${EN?'backstab':'zezadu'} ${c.backstab}`:''}</div></div>`; })()}</div>` : '';
  return `<div class="gs">${armBox}${dmgBox}</div>`;
}

/* ---------- list ---------- */
const TIER = n => /Flametal|Ask|Embla/.test(n)?9:/Carapace|Mistwalker|Himmin|Krom|Jotun|Spine|Arbalest/.test(n)?8:/Blackmetal|BlackMetal|Needle|Porcupine/.test(n)?7:/Silver|Frostner|Fang|Draugr/.test(n)?6:/Iron|Serpent|Banded|Huntsman/.test(n)?5:/Chitin|Elderbark|Root|Bone/.test(n)?4:/Bronze|FineWood|Buckler/.test(n)?3:/Flint|Stagbreaker|Bjorn/.test(n)?2:/Stone|Wood/.test(n)?1:0;
const bestOf = arr => arr.filter(i=>!/^(Hammer|Hoe|Cultivator|Pickaxe|Torch)/.test(i.name)).sort((a,b)=>(TIER(b.name)-TIER(a.name))||(b.q-a.q))[0];
const MELEE_RE = /^(Knife|Axe|Sword|Mace|Club|Spear|Atgeir|Sledge|Battleaxe|Fistweapon|Pickaxe|Torch|Staff)/;
const SLOTS = [[MELEE_RE,'Zbraň',true],[/^Shield/,'Štít',true],[/^(Bow|Crossbow)/,'Luk',true],[/^Helmet/,'Hlava'],[/Chest$/,'Hruď'],[/Legs$/,'Nohy'],[/^Cape/,'Plášť'],[/^Belt|^Megingjord/,'Opasek'],[/^Trinket|^Wishbone/,'Amulet']];
const BIG_RE = /troll|bjorn|abomination|stonegolem|golem|lox|(?<!greydwarf)brute|elite|wraith|serpent|fenring|ulv|gjall|tick|dvergr|eikthyr|gdking|bonemass|dragon|goblinking|queen|fader|boss/i;
const MAXDUR = {CapeTrollHide:600,CapeDeerHide:400,ArmorBerserkerChest:1400,ArmorBerserkerLegs:1400,HelmetBerserkerHood:1400,ShieldIronBuckler:250,KnifeChitin:250,ArmorTrollLeatherChest:1000,ArmorTrollLeatherLegs:1000,HelmetTrollLeather:1000,ArmorLeatherChest:400,ArmorLeatherLegs:400,HelmetLeather:400,ArmorBronzeChest:1000,ArmorBronzeLegs:1000,HelmetBronze:1000,ArmorIronChest:1000,ArmorIronLegs:1000,HelmetIron:1000};
const topN = (o,n) => Object.entries(o||{}).sort((a,b)=>b[1]-a[1]).slice(0,n);
const kvRows = rows => rows.map(([k,v,sub])=>`<tr${sub?' class="sub"':''}><td>${k}</td><td>${typeof v==='number'?fmt(v):v}</td></tr>`).join('');
const kvTable = rows => `<table class="kv">${kvRows(rows)}</table>`;
const listTable = (o,n) => kvTable(topN(o,n).map(([k,v])=>[esc(cz(k)),v]));

  if(dungeonLost) trivia.push(EN ? `<span class="k">${dungeonLost}×</span> entered a dungeon and never walked out the door.` : `<span class="k">${dungeonLost}×</span> vešel do dungeonu a nevyšel dveřmi.`);

/* ---------- tooltip detail predmetu ---------- */
const TROPHY_ENEMY = {TrophyFrostTroll:'$enemy_troll',TrophyTheElder:'$enemy_gdking',TrophySkeletonPoison:'$enemy_skeletonpoison',TrophyHatchling:'$enemy_hatchling',TrophySGolem:'$enemy_stonegolem',TrophyDragonQueen:'$enemy_dragon',TrophyGoblinKing:'$enemy_goblinking',TrophyCultist:'$enemy_fenringcultist',TrophyGoblin:'$enemy_goblin',TrophyGoblinBrute:'$enemy_goblinbrute',TrophyGoblinShaman:'$enemy_goblinshaman'};
const trophyEnemy = t => TROPHY_ENEMY[t] || ('$enemy_'+t.replace(/^Trophy/,'').toLowerCase());
const tipEl = document.createElement('div'); tipEl.className='tip'; document.body.appendChild(tipEl);
const CHARS_BY_NAME = {};
/* ---------- stav dat: kdy byl soubor postavy ulozen ---------- */
function stamp(D){
  const EN=LANG==='en'; const iso=D.meta&&D.meta.saved; if(!iso) return '';
  const d=new Date(iso); if(isNaN(d)) return '';
  const day0=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime(); const days=Math.round((day0(new Date())-day0(d))/864e5);
  const cls = days<=2?'fresh':days<=10?'ok':'old';

    });
  });

  if(document.getElementById('dropS')) document.getElementById('dropS').innerHTML = LANG==='en' ? 'Processed only in your browser, nothing is uploaded. Steam: Program Files (x86)\\Steam\\userdata\\&lt;id&gt;\\892970\\remote\\characters' : 'Zpracuje se jen u tebe v prohlížeči, nikam se neposílá. Steam: Program Files (x86)\\Steam\\userdata\\&lt;id&gt;\\892970\\remote\\characters';
  document.querySelectorAll('#who button').forEach(b=>b.classList.toggle('on', visible.has(b.dataset.who)));
  if(!DATA.site) document.querySelector('.top h1').textContent = document.querySelector('.top h1').textContent.replace(/^Listy vikingů|^Viking sheets/, T('Listy vikingů'));
  if(cmpWrap){ cmpWrap.hidden = shown.length<2; cmpBtn.textContent = LANG==='en'?'Compare':'Porovnat'; cmpBtn.classList.toggle('on', COMPARE && shown.length>=2); cmpBtn.title = LANG==='en'?'Rank of every value across the shown characters':'Pořadí u každé hodnoty napříč zobrazenými postavami'; }
  applyCompare();
  if(window.SITE_RENDER) window.SITE_RENDER();
  document.querySelectorAll('.lang button[data-lang]').forEach(b=>b.classList.toggle('on', b.dataset.lang===LANG));
  updateNav(); updateFloat();
}
document.querySelectorAll('.lang button[data-lang]').forEach(b=>b.addEventListener('click',()=>{ LANG=b.dataset.lang; try{ localStorage.setItem('viking-lang',LANG); }catch(e){} render(); }));

/* ---------- posun sloupcu na uzkem monitoru ---------- */
const sheetsEl=document.getElementById('sheets'), navEl=document.getElementById('nav');
function updateNav(){ const n=sheetsEl.querySelectorAll('.sheet').length; const need = n*380 + (n-1)*20; const can = need > sheetsEl.clientWidth + 4; sheetsEl.classList.toggle('scrolling', can); navEl.hidden = !can; if(can){ document.getElementById('navL').disabled = sheetsEl.scrollLeft<=2; document.getElementById('navR').disabled = sheetsEl.scrollLeft+sheetsEl.clientWidth >= sheetsEl.scrollWidth-2; } }
const colStep = () => { const c=sheetsEl.querySelector('.sheet'); return c ? c.getBoundingClientRect().width+20 : 400; };
document.getElementById('navL').addEventListener('click',()=>{ sheetsEl.scrollLeft -= colStep(); updateNav(); });
document.getElementById('navR').addEventListener('click',()=>{ sheetsEl.scrollLeft += colStep(); updateNav(); });
sheetsEl.addEventListener('scroll', updateNav, {passive:true}); window.addEventListener('resize', ()=>requestAnimationFrame(updateNav)); if(window.ResizeObserver) new ResizeObserver(()=>updateNav()).observe(sheetsEl);
/* ---------- plovouci jmena ---------- */
const floatbar=document.getElementById('floatbar');
function updateFloat(){
  const sh=[...sheetsEl.querySelectorAll('.sheet')]; if(!sh.length){ floatbar.classList.remove('on'); return; }
  const firstHead=sh[0].querySelector('.b-head'); const headBottom=firstHead? firstHead.getBoundingClientRect().bottom : 0;
  const on = headBottom < 0 && sheetsEl.getBoundingClientRect().bottom > 60;
  floatbar.classList.toggle('on', on); if(!on) return;
  const vw=Math.max(document.documentElement.clientWidth||0, window.innerWidth||0) || 100000;
  floatbar.innerHTML = sh.map(x=>{ const r=x.getBoundingClientRect(); if(r.right<8||r.left>vw-8) return ''; const l=Math.max(0,r.left), w=Math.min(vw,r.right)-l; if(w<80) return ''; const D=CHARS_BY_NAME[x.querySelector('.name').textContent]; const sub=D? `${D.meta&&D.meta.steam?esc(D.meta.steam)+' · ':''}${hrs((D.worlds_time||{})[Object.keys(D.worlds_time||{})[0]]||0)}` : ''; return `<div class="fn" style="left:${l}px;width:${w}px">${esc(x.querySelector('.name').textContent)}<small>${sub}</small></div>`; }).join('');
}
window.addEventListener('scroll', updateFloat, {passive:true}); window.addEventListener('resize', updateFloat); sheetsEl.addEventListener('scroll', updateFloat, {passive:true});
/* ---------- knihovna (assets/*.json) a nahravani ---------- */
let ITEM_NAMES = [];
async function loadAssets(){
  const st=document.getElementById('dropStatus');
  const get = async (f) => { const r = await fetch(f, {cache:'force-cache'}); if(!r.ok) throw new Error(f+' '+r.status); return r.json(); };
  try{
    st.textContent = LANG==='en' ? 'Loading library…' : 'Načítám knihovnu…';
    const [names, icons, sets, stats, attacks, creatures, ach, desc] = await Promise.all([
      get('/assets/item-names.json'), get('/assets/valheim-icons.json'), get('/assets/sets_front.json'), get('/assets/valheim-stats.json'), get('/assets/valheim-attacks.json'), get('/assets/valheim-creatures.json'), get('/assets/valheim-achievements.json').catch(()=>null), get('/assets/valheim-desc.json').catch(()=>null)
    ]);
    ITEM_NAMES = names;
    ASSETS = { icons: icons.icons, sets, stats: Object.fromEntries(Object.entries(stats.items).filter(([,v])=>v.levels&&v.levels.length).map(([k,v])=>[k,{levels:v.levels, source:v.source}])), attacks: attacks.items, creatures: creatures.items, achievements: ach? {players: ach.players, icons: ach.icons} : null, desc: desc? desc.items : {} };
    st.textContent = '';
  }catch(e){ st.textContent = (LANG==='en'?'Library failed to load: ':'Knihovna se nenačetla: ')+e.message; st.classList.add('err'); }
  render();
}
async function handleFiles(files){
  const st=document.getElementById('dropStatus'); st.classList.remove('err');
  for(const f of files){
    if(!/\.fch$/i.test(f.name)){ st.textContent=(LANG==='en'?'Not a .fch file: ':'Není .fch: ')+f.name; st.classList.add('err'); continue; }
    try{
      st.textContent = (LANG==='en'?'Reading ':'Čtu ')+f.name+'…';
      const buf = await f.arrayBuffer();
      const d = prepChar(await FCH.parseFch(buf, ITEM_NAMES), f);
      if(window.SITE_UPLOAD){ st.textContent=(LANG==='en'?'Uploading ':'Nahrávám ')+d.name+'…'; await window.SITE_UPLOAD(d); st.textContent=(LANG==='en'?'Uploaded ':'Nahráno: ')+d.name; continue; }
      const i = chars.findIndex(c=>c.name===d.name); if(i>=0) chars.splice(i,1,d); else chars.push(d);
      visible.add(d.name); saveChars(); try{ localStorage.setItem('viking-who',JSON.stringify([...visible])); }catch(e){}
      st.textContent = (LANG==='en'?'Loaded ':'Načteno: ')+d.name;
      render();
    }catch(e){ console.error(e); st.textContent=(LANG==='en'?'Cannot read ':'Nejde přečíst ')+f.name+' ('+e.message+')'; st.classList.add('err'); }
  }
}
const dropEl=document.getElementById('drop');
document.getElementById('file').addEventListener('change', ev=>{ handleFiles([...ev.target.files]); ev.target.value=''; });
['dragenter','dragover'].forEach(t=>document.addEventListener(t, ev=>{ ev.preventDefault(); dropEl.classList.add('over'); }));
['dragleave','drop'].forEach(t=>document.addEventListener(t, ev=>{ ev.preventDefault(); if(t==='drop'||ev.target===document.documentElement) dropEl.classList.remove('over'); }));
document.addEventListener('drop', ev=>{ ev.preventDefault(); dropEl.classList.remove('over'); const files=[...(ev.dataTransfer?.files||[])]; if(files.length) handleFiles(files); });
if(DATA.assets){ document.getElementById('drop').remove(); render(); } else { window.ASSETS_READY = loadAssets(); }
</script>
